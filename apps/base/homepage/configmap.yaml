apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true # default, enable ingress
    traefik: true # enable traefik ingressRoute
    gateway: true # enable gateway-api
  settings.yaml: |
    theme: dark # or light
    color: zinc
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Homelab:
        - Mealie:
            href: http://mealie.kevin-morris.net
            icon: mealie.png
            description: Recipes

        - Grafana:
            href: http://grafana.kevin-morris.net
            icon: grafana.png
            description: Monitoring

        - Linkding:
            href: http://linkding.kevin-morris.net
            icon: linkding.png
            description: Bookmarks
        
        - Audiobookshelf:
            href: http://audiobooks.kevin-morris.net
            icon: audiobookshelf.png
            description: Audiobookshelf

        - Pihole:
            icon: pi-hole.png
            href: http://192.168.1.150  # Optional: direct link to admin panel
            widget:
                type: pihole
                url: http://192.168.1.150       # Replace with your Pi-hole IP or domain
                version: 6                     # Required if running Pi-hole v6 or higher
                key: xnCvK3SUwGur3nUmFnPQTBEFGhLrIhv+hoH9mK5X+Sk= # Use your API key (from Expert mode) or web UI password   

    - Consuming:
        - Hacker News:
            href: https://news.ycombinator.com
            icon: hacker-news.png
            description: Hacker News

        - YouTube:
            href: https://www.youtube.com/
            icon: youtube.png
            description: YouTube


    - Creating:
        - LinkedIn:
            href: https://www.linkedin.com/feed/
            icon: linkedin.png
            description: LinkedIn

        - X:
            href: https://x.com/home
            icon: x.png
            description: X

    - Learning:
        - Kubernetes:
            href: http://kubernetes.io/docs/home
            icon: kubernetes.png
            description: Kubernetes

        - Skool:
            href: https://www.skool.com/kubecraft/classroom
            icon: google-scholar.png
            description: Skool

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Careus"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        cputemp: true
        network: default
        #tempmin: 0 # optional, minimum cpu temp
        #tempmax: 100 # optional, maximum cpu temp
        uptime: true
        units: metric # only used by cpu temp, options: 'imperial' or 'metric'
        refresh: 3000 # optional, in ms
    - search:
        provider: brave
        target: _blank
    - openweathermap:
        label: Morrisville #optional
        latitude: 35.82348
        longitude: -78.82556
        units: imperial # or metric
        provider: openweathermap
        apiKey: e172ad44cf206c004ba7f8e04555 # Time in minutes to cache API responses, to stay within limits
        format: # optional, Intl.NumberFormat options
        maximumFractionDigits: 0
  docker.yaml: ""
