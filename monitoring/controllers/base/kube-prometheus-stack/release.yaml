apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 81.2.2
      # version: "79.0.0"
      # version: "77.1.1"
      # version: "66.2.2"
      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  valuesFrom:
    - kind: Secret
      name: grafana-admin-secret
      valuesKey: admin-password
      targetPath: grafana.adminPassword
  values:
    grafana:
      persistence:
        enabled: true
        existingClaim: grafana-data
      initChownData:
        enabled: false
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Viewer
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.kevin-morris.net
        tls:
          - secretName: grafana-tls-secret
            hosts:
              - grafana.kevin-morris.net

    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: prometheus-kube-prometheus-stack-prometheus-db
            spec:
              storageClassName: local-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            metadata:
              name: alertmanager-kube-prometheus-stack-alertmanager-db
            spec:
              storageClassName: local-storage
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
