apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-grafana
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    name: grafana-data
    namespace: monitoring
  nfs:
    server: 192.168.1.50
    path: /volume1/pvs/grafana-data
