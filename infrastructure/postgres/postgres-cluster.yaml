apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  instances: 1
  enableSuperuserAccess: true
  postgresUID: 1001
  postgresGID: 10
  storage:
    size: 10Gi
    storageClass: local-storage
  bootstrap:
    initdb:
      database: app
      owner: app
  monitoring:
    enablePodMonitor: true
