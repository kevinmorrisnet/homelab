apiVersion: v1
kind: PersistentVolume
metadata:
  name: pgadmin-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  mountOptions:
    - nolock
  nfs:
    server: 192.168.1.50
    path: /volume1/pvs/pgadmin
  claimRef:
    name: pgadmin-pvc
    namespace: pgadmin
