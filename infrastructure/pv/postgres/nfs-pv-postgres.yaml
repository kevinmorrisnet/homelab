apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-cluster-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  nfs:
    server: 192.168.1.50
    path: /volume1/postgres
  claimRef:
    namespace: postgres
    name: postgres-cluster-1
